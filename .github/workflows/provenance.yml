# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Validate

on:
  push:
    branches: [ "test" ]
  
jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    env:
      IMAGE_NAME: gophers-api
      REGISTRY: quay.io/skhoury/gophers-api
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        uses: redhat-actions/podman-install@main  

      - name: Build Action
        run: |
          auth_file=$(cat << 'EOF1'
          {
            "auths": {
              "registry.redhat.io": {
                "auth": "${{ secrets.REGISTRY_TOKEN }}",
                "email": "skhoury@redhat.com"
              }
            }
          }
          EOF1
          )
          echo "$auth_file" > /tmp/auth.json

          podman login --authfile /tmp/auth.json registry.redhat.io 
          podman build --authfile /tmp/auth.json -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          echo "DIGEST=$(podman inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format='{{index .Digest}}')" >> $GITHUB_ENV
          podman login -p ${{ secrets.QUAY_TOKEN }} -u skhoury ${{ env.REGISTRY }}
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: docker login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: skhoury
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true