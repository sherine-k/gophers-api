# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Validate

on:
  push:
    branches: [ "test" ]
  
jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    env:
      IMAGE_NAME: gophers-api
      REGISTRY: quay.io/skhoury/gophers-api
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        uses: redhat-actions/podman-install@main  
      - name: Build Action
        run: |
          podman build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          digest=`podman inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format='{{index .Digest}}'`
      
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: false
          provenance-format: in-toto